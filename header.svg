<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color"
          values="#0f172a;#1e1b4b;#0f172a"
          dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#312e81">
        <animate attributeName="stop-color"
          values="#312e81;#581c87;#312e81"
          dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color"
          values="#0f172a;#172554;#0f172a"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGradient">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc">
        <animate
          attributeName="offset"
          values="100%;0%;100%"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="25" fill="url(#bg)"/>

  <!-- Animated stars -->
  <g fill="#ffffff">

    <circle cx="100" cy="60" r="2">
      <animate attributeName="opacity"
        values="0.2;1;0.2"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="180" r="2">
      <animate attributeName="opacity"
        values="1;0.2;1"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="390" cy="55" r="2">
      <animate attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="65" r="2">
      <animate attributeName="opacity"
        values="1;0.2;1"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="180" r="2">
      <animate attributeName="opacity"
        values="0.2;1;0.2"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1120" cy="80" r="2">
      <animate attributeName="opacity"
        values="1;0.2;1"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Floating circles -->
  <circle cx="100" cy="130" r="45"
          fill="none"
          stroke="#a855f7"
          stroke-width="2"
          opacity="0.35">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;20 -15;0 0"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1090" cy="130" r="55"
          fill="none"
          stroke="#60a5fa"
          stroke-width="2"
          opacity="0.3">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-20 15;0 0"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Main name -->
  <text x="600" y="115"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="url(#textGradient)"
        filter="url(#glow)">
    Hi,MONIKA M Here 
  </text>

  <!-- Subtitle -->
  <text x="600" y="160"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#e2e8f0">
    Artificial Intelligence &amp; Data Science Engineer
  </text>

  <!-- Animated line -->
  <rect x="350" y="185"
        width="500"
        height="2"
        rx="2"
        fill="#a855f7">

    <animate
      attributeName="width"
      values="250;500;250"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="475;350;475"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Bottom text -->
  <text x="600" y="220"
        text-anchor="middle"
        font-family="monospace"
        font-size="16"
        fill="#94a3b8">

    &lt; Build • Learn • Create • Repeat /&gt;

  </text>

</svg>
