<svg width="1200" height="330" viewBox="0 0 1200 330"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Futuristic background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#17104a"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Animated text gradient -->
    <linearGradient id="textGradient">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>

      <animate
        attributeName="x1"
        values="0%;100%;0%"
        dur="5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- AI core -->
    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Futuristic grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

      <path
        d="M 45 0 L 0 0 0 45"
        fill="none"
        stroke="#6366f1"
        stroke-width="0.5"
        opacity="0.18"/>

    </pattern>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect
    width="1200"
    height="330"
    rx="28"
    fill="url(#bg)"/>

  <rect
    width="1200"
    height="330"
    rx="28"
    fill="url(#grid)"/>


  <!-- ================= FLOATING PARTICLES ================= -->

  <g fill="#c084fc">

    <circle cx="80" cy="70" r="2">
      <animate
        attributeName="cy"
        values="70;55;70"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="170" cy="245" r="2">
      <animate
        attributeName="cy"
        values="245;225;245"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="1030" cy="70" r="2">
      <animate
        attributeName="cy"
        values="70;50;70"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="1120" cy="235" r="2">
      <animate
        attributeName="cy"
        values="235;215;235"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================= NEURAL NETWORK ================= -->

  <g
    stroke="#6366f1"
    stroke-width="1.5"
    opacity="0.6"
    fill="none">

    <!-- Left network -->
    <path d="M100 150 L230 105 L350 150"/>
    <path d="M100 150 L230 200 L350 150"/>
    <path d="M230 105 L230 200"/>

    <!-- Right network -->
    <path d="M850 150 L970 105 L1100 150"/>
    <path d="M850 150 L970 200 L1100 150"/>
    <path d="M970 105 L970 200"/>

    <!-- Core connections -->
    <path d="M350 150 L480 150"/>
    <path d="M720 150 L850 150"/>

  </g>


  <!-- ================= NETWORK NODES ================= -->

  <g fill="#60a5fa" filter="url(#glow)">

    <circle cx="100" cy="150" r="5">
      <animate
        attributeName="r"
        values="4;8;4"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="230" cy="105" r="5"/>
    <circle cx="230" cy="200" r="5"/>
    <circle cx="350" cy="150" r="6"/>

    <circle cx="850" cy="150" r="6"/>

    <circle cx="970" cy="105" r="5"/>
    <circle cx="970" cy="200" r="5"/>

    <circle cx="1100" cy="150" r="5">
      <animate
        attributeName="r"
        values="4;8;4"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================= MOVING DATA ================= -->

  <g fill="#22d3ee">

    <circle r="4">

      <animateMotion
        path="M100 150 L230 105 L350 150 L480 150"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle r="4">

      <animateMotion
        path="M1100 150 L970 105 L850 150 L720 150"
        dur="3.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================= AI CORE ================= -->

  <circle
    cx="600"
    cy="150"
    r="75"
    fill="#6366f1"
    opacity="0.12"
    filter="url(#bigGlow)">

    <animate
      attributeName="r"
      values="65;82;65"
      dur="3s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.08;0.25;0.08"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="600"
    cy="150"
    r="43"
    fill="url(#core)"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="40;46;40"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- AI symbol -->

  <text
    x="600"
    y="161"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="bold"
    fill="white">

    AI

  </text>


  <!-- ================= TOP TITLE ================= -->

  <text
    x="600"
    y="55"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    letter-spacing="5"
    fill="#94a3b8">

    WELCOME TO MY AI SPACE

    <animate
      attributeName="opacity"
      values="0.5;1;0.5"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================= MAIN INTRODUCTION ================= -->

  <text
    x="600"
    y="250"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="3"
    fill="url(#textGradient)"
    filter="url(#glow)">

    HI, I'M MONIKA M

  </text>


  <!-- ================= PROFESSION ================= -->

  <text
    x="600"
    y="280"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    letter-spacing="1.5"
    fill="#e2e8f0">

    Artificial Intelligence &amp; Data Science Engineer

  </text>


  <!-- ================= TERMINAL ================= -->

  <text
    x="600"
    y="307"
    text-anchor="middle"
    font-family="monospace"
    font-size="13"
    fill="#64748b">

    &lt; build • learn • create • repeat /&gt;

    <animate
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="2.5s"
      repeatCount="indefinite"/>

  </text>

</svg>
